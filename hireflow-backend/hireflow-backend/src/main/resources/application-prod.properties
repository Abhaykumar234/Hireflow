# Production Profile - PostgreSQL Database

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hireflow}
spring.datasource.username=${DATABASE_USERNAME:hireflow_user}
spring.datasource.password=${DATABASE_PASSWORD:HireFlow2026!Secure}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 Console - DISABLED in production
spring.h2.console.enabled=false

# CORS - Restrict to your domain
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# Security
logging.level.org.springframework.security=WARN
logging.level.com.hireflow=INFO
