server.port=8080
spring.application.name=hireflow-backend

# Active Profile (dev or prod)
spring.profiles.active=dev

# JWT Configuration
jwt.secret=hireflow-super-secret-key-change-this-in-production-min-256-bits-required-for-hs256-algorithm
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Email Configuration (Update with your SMTP details)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.hireflow=DEBUG
logging.level.org.springframework.security=DEBUG

# Security
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
logging.level.org.springframework.web=INFO
logging.level.com.hireflow=DEBUG
